# Import local configuration if present (git-ignored for local credentials)
spring.config.import=optional:file:./application-local.properties

# Application Configuration
spring.application.name=paybridge-backend
server.port=${PORT:8081}

# Logging
logging.level.com.paybridge=INFO
logging.level.org.springframework.web=INFO

# PayPal Sandbox Configuration
paypal.base-url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}

# Gemini AI Configuration
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/paybridge_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
